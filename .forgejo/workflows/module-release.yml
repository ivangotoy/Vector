# Builds the module from main merged with upstream, releases it on this forge and
# points the module's updateJson at this repo. Logic: .forgejo/module-ci.sh,
# per-repo settings: .forgejo/module-ci.conf.
name: module-release

on:
  workflow_dispatch:

# One release at a time: an overlapping run published its release and then failed to push
# update.json behind the other, so that release never reached the feed. A second dispatch waits.
concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: kernelsu-ci
    timeout-minutes: 170
    steps:
      # the dispatched commit, also when main has moved since: the tests, the root half of the
      # build and the release step then all use the same module-ci.sh and conf
      - name: Checkout (the dispatched commit)
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          # the clone runs before module-ci.sh sets these: a stalled transfer fails instead of hanging
          GIT_HTTP_LOW_SPEED_LIMIT: 1024
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          set -eu
          git clone -q --branch main "$SERVER_URL/$REPOSITORY.git" src
          git -C src checkout -q --detach "$BASE_SHA"
      - name: Offline tests (.forgejo/tests/run.sh, no secrets)
        run: bash src/.forgejo/tests/run.sh
      - name: Build (no forge token, unprivileged build user)
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -eu
          bash src/.forgejo/module-ci.sh build src
      - name: Release (script and config from the dispatched commit)
        env:
          RELEASE_TOKEN: ${{ secrets.MODULE_RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          curl -fsS --connect-timeout 30 --max-time 120 -o module-ci.sh "$SERVER_URL/$REPOSITORY/raw/commit/$BASE_SHA/.forgejo/module-ci.sh"
          bash module-ci.sh release src
