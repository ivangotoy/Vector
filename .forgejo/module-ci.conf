UPSTREAM_URL=https://github.com/JingMatrix/Vector.git
UPSTREAM_BRANCH=master
ZIP_PREFIX=Vector
CHANGELOG_PATH=zygisk/changelog.md
# upstream .github/workflows/core.yml: JDK 21, submodules, signing key, ./gradlew zipAll,
# release = zygisk/release/Vector-v*-Release.zip. versionCode counts refs/remotes/origin/master
# (here the merged HEAD); versionName is the newest tag, so the workspace gets upstream's tags only.
build() {
    for v in SIGN_KEYSTORE_B64 SIGN_KEY_ALIAS SIGN_STORE_PASSWORD SIGN_KEY_PASSWORD; do
        [ -n "${!v}" ] || { echo "$v is not set: refusing a debug-signed build" >&2; return 1; }
    done
    git submodule update -q --init --recursive >&2
    git update-ref refs/remotes/origin/master HEAD
    # framework self-update (GitHubRepository.releaseListJson -> frameworkReleases) reads this
    # fork's .forgejo/releases.json instead of the GitHub release list; the community feed,
    # contributors and issues stay on GitHub. Workspace only, assume-unchanged keeps the tree clean.
    f=manager/src/main/kotlin/org/matrix/vector/manager/data/github/GitHubRepository.kt
    grep -qF 'get("$API/$REPO/releases?per_page=$CANARY_FETCH", freshness)' "$f" || { echo "release list URL not found" >&2; return 1; }
    sed -i "s|get(\"\$API/\$REPO/releases?per_page=\$CANARY_FETCH\", freshness)|get(\"$SERVER_URL/$REPOSITORY/raw/branch/main/.forgejo/releases.json\", freshness)|" "$f"
    grep -qF "$SERVER_URL/$REPOSITORY/raw/branch/main/.forgejo/releases.json" "$f" || { echo "release list URL not replaced" >&2; return 1; }
    git update-index --assume-unchanged "$f"
    git tag -l | xargs -r git tag -d >/dev/null
    git fetch -q --tags "$UPSTREAM_URL"
    # keystore readable by the build user only, removed when this build process exits
    trap 'rm -f "$HOME/key.jks"' EXIT
    (umask 077; printf '%s' "$SIGN_KEYSTORE_B64" | base64 -d > "$HOME/key.jks")
    export ORG_GRADLE_PROJECT_androidStoreFile="$HOME/key.jks" ORG_GRADLE_PROJECT_androidKeyAlias="$SIGN_KEY_ALIAS" \
        ORG_GRADLE_PROJECT_androidStorePassword="$SIGN_STORE_PASSWORD" ORG_GRADLE_PROJECT_androidKeyPassword="$SIGN_KEY_PASSWORD"
    export VECTOR_BUILD_REPOSITORY="$REPOSITORY" VECTOR_BUILD_COMMIT="$(git rev-parse HEAD)"
    export JAVA_HOME="$JAVA_HOME_21"
    chmod +x gradlew
    ./gradlew --no-daemon zipAll >&2
    mv zygisk/release/Vector-v*-Release.zip "$OUT/module.zip"
}

# release step: GitHub release-list JSON (fields GhRelease/GhReleaseAsset read) with the newest
# release first, up to 12; the asset name carries only the versionCode ("Vector-v<x>-<vc>-Release.zip"),
# because versionCode() takes the last 3+ digit run of a "Vector-" asset name.
release_files() {
    python3 -I - .forgejo/releases.json "$TAG" "$VERSION" "$VC" "$SRC_SHA" "$BODY" "$ZIP_URL" "$ZIP_SIZE" \
        "$SERVER_URL/$REPOSITORY/releases/tag/$TAG" <<'PY'
import datetime, json, os, re, sys
path, tag, version, vc, sha, body, zip_url, size, html = sys.argv[1:]
old = json.load(open(path)) if os.path.exists(path) else []
base = re.match(r"(v[0-9.]+)", version).group(1)
now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
rel = {"id": int(vc), "tag_name": tag, "name": "Vector " + version, "prerelease": False,
       "target_commitish": sha, "published_at": now, "html_url": html, "body": body,
       "assets": [{"id": int(vc), "name": f"Vector-{base}-{vc}-Release.zip", "size": int(size),
                   "browser_download_url": zip_url}]}
rels = [rel] + [r for r in old if r.get("tag_name") != tag]
json.dump(rels[:12], open(path, "w"), indent=2)
open(path, "a").write("\n")
PY
    RELEASE_FILES=".forgejo/releases.json"
}
