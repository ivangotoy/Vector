UPSTREAM_URL=https://github.com/JingMatrix/Vector.git
UPSTREAM_BRANCH=master
ZIP_PREFIX=Vector
CHANGELOG_PATH=zygisk/changelog.md
# upstream .github/workflows/core.yml: JDK 21, submodules, signing key, ./gradlew zipAll,
# release = zygisk/release/Vector-v*-Release.zip. versionCode counts refs/remotes/origin/master
# (here the merged HEAD); versionName is the newest tag, so the workspace gets upstream's tags only.
build() {
    for v in SIGN_KEYSTORE_B64 SIGN_KEY_ALIAS SIGN_STORE_PASSWORD SIGN_KEY_PASSWORD; do
        [ -n "${!v}" ] || { echo "$v is not set: refusing a debug-signed build" >&2; return 1; }
    done
    git submodule update -q --init --recursive >&2
    git update-ref refs/remotes/origin/master HEAD
    git tag -l | xargs -r git tag -d >/dev/null
    git fetch -q --tags "$UPSTREAM_URL"
    printf '%s' "$SIGN_KEYSTORE_B64" | base64 -d > "$HOME/key.jks"
    export ORG_GRADLE_PROJECT_androidStoreFile="$HOME/key.jks" ORG_GRADLE_PROJECT_androidKeyAlias="$SIGN_KEY_ALIAS" \
        ORG_GRADLE_PROJECT_androidStorePassword="$SIGN_STORE_PASSWORD" ORG_GRADLE_PROJECT_androidKeyPassword="$SIGN_KEY_PASSWORD"
    export VECTOR_BUILD_REPOSITORY="$REPOSITORY" VECTOR_BUILD_COMMIT="$(git rev-parse HEAD)"
    export JAVA_HOME="$JAVA_HOME_21"
    chmod +x gradlew
    ./gradlew --no-daemon zipAll >&2
    mv zygisk/release/Vector-v*-Release.zip "$OUT/module.zip"
}
